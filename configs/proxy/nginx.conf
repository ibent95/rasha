# ============================================
# RASHA Super App — Nginx Reverse Proxy
# Routes subdomains to Angular websites via host-mapped ports
# Supports both HTTP and HTTPS (self-signed certs)
# ============================================
# Usage:
#   http://rasha.local         → Portal (:4400)
#   https://rasha.local        → Portal (:4400) via SSL
#   http://crm.rasha.local     → CRM (:4401)
#   http://dynamic-form.rasha.local → Dynamic Form (:4402)
#   http://erp.rasha.local     → ERP (:4403)
#   http://api.rasha.local     → Core API (:8400)
#
# Add to /etc/hosts:
#   127.0.0.1 rasha.local crm.rasha.local dynamic-form.rasha.local erp.rasha.local api.rasha.local
#
# Generate SSL certs: ./scripts/generate-ssl-certs.sh
# ============================================

# --- Portal (default) ---
server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;
    server_name rasha.local www.rasha.local;

    ssl_certificate     /etc/nginx/ssl/rasha.crt;
    ssl_certificate_key /etc/nginx/ssl/rasha.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP to HTTPS redirect
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://rasha-web-portal-angular:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

