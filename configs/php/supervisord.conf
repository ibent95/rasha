; ============================================
; Supervisor Configuration - RASHA Core Service
; ============================================

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700
chown=nobody:nogroup

[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
logfile_backups=0
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
silent=false
minfds=1024
minprocs=200
user=root
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; ============================================
; Program: PHP-FPM
; ============================================
[program:php8.4-fpm]
command=/usr/sbin/php-fpm8.4 --nodaemonize --fpm-config /etc/php/8.4/fpm/php-fpm.conf
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stopsignal=INT
user=root
stderr_logfile=/var/log/php/fpm-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/var/log/php/fpm-access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ============================================
; Program: Nginx
; ============================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stopsignal=QUIT
user=root
stderr_logfile=/var/log/nginx/supervisor-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/var/log/nginx/supervisor-access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ============================================
; Program: Log Tail
; ============================================
[program:log-tail]
command=/bin/sh -c "tail -F /var/log/nginx/backend-error.log /var/log/nginx/backend-access.log /var/log/php/fpm-error.log /var/www/html/storage/logs/laravel.log > /proc/1/fd/1 2>&1"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
