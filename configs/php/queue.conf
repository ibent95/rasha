; ============================================
; Supervisor — Queue Worker (optional)
; Appended at runtime when QUEUE_ENABLE=true
; ============================================

[program:queue-work]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=false
autorestart=true
startretries=3
stopwaitsecs=60
stopsignal=TERM
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
