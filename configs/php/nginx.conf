# ============================================
# RASHA Backend - Laravel PHP-FPM Site
# ============================================
server {
    listen 8400;
    listen [::]:8400;
    server_name backend.rasha.local;

    root /var/www/html/public;
    index index.php index.html;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # Malformed Request Protection
    # ============================================
    if ($request_uri ~* "\x00") { return 400; }
    if ($request_uri ~* "\.\./") { return 400; }
    if ($uri ~* ".{2048}") { return 414; }

    location ~* (\/vendor\/|\/storage\/|\/bootstrap\/|\/config\/|\.env|\.git\/|wp-\/|xmlrpc\.php) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/backend-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/backend-error.log warn;

    # ============================================
    # Static Files
    # ============================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ============================================
    # PHP-FPM Processing
    # ============================================
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_param PHP_VALUE "
            expose_php=0
            display_errors=0
            error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
        ";
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage/app|storage/framework|storage/logs|bootstrap/cache|config|database|resources|routes|vendor) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
