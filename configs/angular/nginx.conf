# ============================================
# RASHA Super App Frontend - Angular SPA Site
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name rasha.local www.rasha.local _;

    root /var/www/html/browser;
    index index.html;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/frontend-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/frontend-error.log warn;

    # ============================================
    # Gzip
    # ============================================
    gzip_static on;
    gzip_vary on;

    # ============================================
    # SPA Routing
    # ============================================
    location / {
        try_files $uri $uri/ /index.csr.html /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Built Assets - Long-term Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ============================================
    # API Proxy to Core Service
    # ============================================
    location /public/api/ {
        proxy_pass http://rasha-svc-core-laravel:8400/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 120;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ============================================
    # Dynamic Form Service Proxy
    # ============================================
    location /public/api/dynamic-form/ {
        proxy_pass http://rasha-svc-dynamic-form-laravel:8402/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
