<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradien Utama R: Merah -> Jingga -> Kuning -->
    <linearGradient id="r-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="50%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#FDD835" />
    </linearGradient>

    <!-- Gradien Aksen Cincin/Lintasan: Hijau Energi -> Transparan -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow untuk Efek Kedalaman Dimensi -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Kontemporer Minimalistik (Dark Mode) -->
  <rect width="100%" height="100%" fill="#121214"/>

  <!-- Elemen Estetik: Kisi Geometri Ruang Semesta (Grid System) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <circle cx="400" cy="400" r="300" fill="none"/>
    <circle cx="400" cy="400" r="200" fill="none"/>
    <line x1="100" y1="400" x2="700" y2="400" />
    <line x1="400" y1="100" x2="400" y2="700" />
  </g>

  <!-- KOMPONEN LOGO UTAMA -->
  <g filter="url(#shadow)">

    <!-- Elemen 1: Cincin Ruang/Akasha (Hijau) -->
    <path d="M 280,580 A 240,200 45 1 0 540,250" fill="none" stroke="url(#orbit-grad)" stroke-width="24" stroke-linecap="round" />

    <!-- Elemen 2: Huruf R Geometris (Merah-Jingga-Kuning) -->
    <!-- Batang Vertikal Kiri R -->
    <path d="M 300,220 L 300,580" fill="none" stroke="url(#r-grad)" stroke-width="48" stroke-linecap="round" />

    <!-- Lengkungan Kepala R (Loop) -->
    <path d="M 300,220 C 450,220 480,380 300,380" fill="none" stroke="url(#r-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Kaki Kanan R yang Melesat Keluar Melintasi Cincin -->
    <path d="M 320,380 L 520,580" fill="none" stroke="url(#r-grad)" stroke-width="48" stroke-linecap="round" />

    <!-- Elemen 3: Bintang Impian / Polaris (Putih Bersih) -->
    <path d="M 520,580 L 525,550 L 555,545 L 525,540 L 520,510 L 515,540 L 485,545 L 515,550 Z" fill="#FFFFFF" />
    <circle cx="520" cy="545" r="4" fill="#FFFFFF" filter="blur(1px)"/>
  </g>

  <!-- Teks Brand -->
  <text x="400" y="700" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="12" text-anchor="middle">RASHA</text>
  <text x="400" y="740" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#8E8E93" letter-spacing="4" text-anchor="middle">RUANG IMPIAN</text>
</svg>
