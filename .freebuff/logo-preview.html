<style>

<h1>RASHA v11 — Exact Visual Design Match</h1>

    <div class="card-label">Master Logo — 400×400</div>

// === Exact geometry from Rasha-Brand.png, scaled from 716→800 (×1.1173) ===
// Original center: (358,358) → scaled center: (400, 400)
// Original bbox: (181,181)-(534,534) → scaled: (202,202)-(597,597)
const S = 800 / 716; // scale factor
const O = 400 - 358 * S; // offset to center

function t(x, y) {
  return [Math.round((x * S + O) * 10) / 10, Math.round((y * S + O) * 10) / 10];
}

    <linearGradient id="rGrad" gradientUnits="userSpaceOnUse" x1="350" y1="620" x2="560" y2="180">

      <stop offset="100%" stop-color="${P.forest}" stop-opacity="0.15"/>

      <stop offset="100%" stop-color="${P.ivory}" stop-opacity="0"/>

  <rect width="800" height="800" fill="${P.obsidian}"/>

  <!-- Star glow -->
  <circle cx="590" cy="210" r="80" fill="url(#starGlow)"/>

  <!-- Exact geometry from visual design — Forest green -->
  <path d="${exactGeometryPath()}" fill="${P.forest}" opacity="0.7"/>

  <!-- Orbit ring — tilted ellipse behind/through the geometry -->

    fill="none" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Planetary node on orbit -->
  <circle cx="660" cy="340" r="11" fill="${P.burntOrange}" opacity="0.9"/>

  <!-- R letterform — bold, geometric, over the geometry -->
  <!-- Stem -->
  <path d="M 340,610 L 340,190"
    fill="none" stroke="url(#rGrad)" stroke-width="58" stroke-linecap="round"/>
  <!-- Bowl -->
  <path d="M 340,190 C 430,175 560,225 560,350 C 560,440 490,490 400,490"
    fill="none" stroke="url(#rGrad)" stroke-width="58"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Leg -->
  <path d="M 400,490 L 590,610"
    fill="none" stroke="url(#rGrad)" stroke-width="58" stroke-linecap="round"/>

  <!-- Star — 4-point compass rose -->
  <path d="M 590,170 L 598,200 L 628,210 L 598,220 L 590,250 L 582,220 L 552,210 L 582,200 Z"
    fill="${P.ivory}"/>

  `;
}

buildMaster(document.getElementById('master'));

// === Pixel probe ===
setTimeout(() => {
  const canvas = document.getElementById('probe');
  const ctx = canvas.getContext('2d');
  const svgEl = document.getElementById('master');
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, 800, 800);
    const probes = [
      { name: 'bg-corner', x: 30, y: 30 },
      { name: 'geo-top', x: 400, y: 225 },
      { name: 'geo-center', x: 400, y: 400 },
      { name: 'geo-left', x: 225, y: 400 },
      { name: 'geo-right', x: 575, y: 400 },
      { name: 'geo-bottom', x: 400, y: 575 },
      { name: 'R-stem', x: 340, y: 400 },
      { name: 'R-bowl', x: 520, y: 320 },
      { name: 'R-leg', x: 500, y: 550 },
      { name: 'star', x: 590, y: 210 },
      { name: 'orbit-top', x: 400, y: 210 },
      { name: 'orbit-right', x: 680, y: 350 },
      { name: 'planet', x: 660, y: 340 },
      { name: 'wordmark', x: 400, y: 720 },
    ];
    let out = '';
    for (const p of probes) {
      const d = ctx.getImageData(p.x, p.y, 1, 1).data;
      const hex = '#' + [d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      out += `${p.name.padEnd(16)} (${String(p.x).padStart(3)},${String(p.y).padStart(3)})  ${hex}  a=${d[3]}\n`;
    }
    document.getElementById('probeOut').textContent = out;
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
}, 300);
</script>
